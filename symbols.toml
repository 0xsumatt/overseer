[hyperliquid_deployers.xyz]
label = "TradeXYZ"

[hyperliquid_deployers.io]
label = "Entropy"

[venues.binance_spot]
intervals = ["1m"]
orderbook = true

[venues.binance_perp]
intervals = ["1m"]
orderbook = true
funding = "all"
liquidity = true
# aggTrade tape, settlement-windowed. Adapter is written and parse-verified,
# but fstream.binance.com delivered no data from the dev machine (spot streams
# and REST fapi both fine) — likely a jurisdiction block on the futures socket.
# Smoke-test from the soak server, then uncomment.
# stream = true

[venues.hyperliquid]
intervals = ["1m"]
orderbook = true
funding = "all"
liquidity = "all"
# Public trade tape over websocket. true = raw trades kept only around funding
# settlements; the per-minute flow aggregate is continuous regardless.
stream = true

[venues.hyperliquid_xyz]
intervals = ["1m"]
orderbook = true
funding = "all"
liquidity = "all"

[venues.bybit_spot]
intervals = ["1m"]
orderbook = true

[venues.bybit_perp]
intervals = ["1m"]
orderbook = true
funding = "all"
liquidity = "all"
# publicTrade tape. true = raw trades kept only around funding settlements;
# per-minute flow (trades_1m) is aggregated continuously either way, so the
# flow series has no gaps. "tape" would keep every trade — ~1.35 GB/day.
stream = true

[venues.lighter]
intervals = ["1m"]
orderbook = true
funding = "all"
liquidity = "all"

[venues.extended]
intervals = ["1m"]
orderbook = true
funding = "all"
liquidity = "all"

[venues.bulk]
intervals = ["1m"]
funding = true
liquidity = true


[venues.rise]
intervals = ["1m"]
orderbook = true
funding = "all"
liquidity = "all"
 
[venues.bullet]
intervals = []
orderbook = true
funding = "all"
liquidity = "all"

