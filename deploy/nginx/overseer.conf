upstream overseer_web {
    server 127.0.0.1:8000;
}

# A static URL carrying ?v= changes whenever its file does, so browsers may keep
# it for a year; unversioned files (fonts, icons, the chart library) an hour.
map $arg_v $static_expires {
    ""      1h;
    default 1y;
}

server {
    server_name dashboard.overseer.so;

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API JSON is 8-17x smaller compressed (/api/funding 86 KB -> 11 KB). No
    # response carries a secret (no CSRF tokens; read-only tokens are never
    # echoed), so compression cannot leak one (BREACH).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;

    location /static/ {
        alias /opt/overseer/src/web/static/;
        expires $static_expires;
        access_log off;
    }

    # Browser-only funding history is posted for exact Decimal aggregation.
    # It is not persisted; ordinary endpoints retain the smaller body limit.
    location = /api/positions/aggregate {
        client_max_body_size 8m;
        proxy_pass http://overseer_web;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
    }

    location /api/positions/ {
        proxy_pass http://overseer_web;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
    }

    location / {
        proxy_pass http://overseer_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
    }

    listen [::]:443 ssl ipv6only=on; 
    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/dashboard.overseer.so/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/dashboard.overseer.so/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

}



server {
    if ($host = dashboard.overseer.so) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dashboard.overseer.so;
    return 404; # managed by Certbot


}